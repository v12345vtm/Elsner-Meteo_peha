# Versie: 0.1.1
#
# Voorbeeld: jouw bestaande Bluetooth-proxy-config, uitgebreid met het Elsner-weerstation.
#
# LET OP: verwijder je oude "uart:" blok (id: xxx, pinnen 16/17). De package regelt de UART
# zelf. Twee UART-blokken op dezelfde pinnen geven een configuratiefout.

packages:
  esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/esp32-generic/esp32-generic.yaml@main
  elsner: github://v12345vtm/Elsner-Meteo_peha/ESPHOME_alternative/elsner-esphome/esphome/elsner-package.yaml@main

# Pinnen overschrijven? Zet de waarden hier (standaard 16 en 17). Voor een ESP32 met PSRAM
# (WROVER) zijn GPIO16/17 al in gebruik: kies dan andere pinnen.
substitutions:
  elsner_rx_pin: "16"
  elsner_tx_pin: "17"
  # elsner_analyse_interval: "10s"

# Tijdens het oplossen van problemen kun je meer logs zien (discard-meldingen van frames):
# logger:
#   level: DEBUG

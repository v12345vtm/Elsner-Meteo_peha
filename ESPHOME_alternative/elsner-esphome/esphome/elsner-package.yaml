# Versie: 0.1.0
#
# ESPHome-package voor het Elsner P03/3 weerstation (RS485).
# Gebruik in je eigen YAML (zie example-bluetooth-proxy.yaml):
#
#   packages:
#     elsner: github://v12345vtm/Elsner-Meteo_peha/esphome/elsner-package.yaml@main
#
# Dit bestand haalt de component zelf op uit GitHub (external_components) en zet
# de UART, de hub en alle entiteiten klaar. Pinnen en interval zijn aan te passen met
# de substitutions hieronder of met dezelfde namen in je eigen YAML.

substitutions:
  elsner_rx_pin: "16"          # RS485-transceiver RO -> deze pin (ontvangen)
  elsner_tx_pin: "17"          # RS485-transceiver DI -> deze pin (niet nodig om te lezen)
  elsner_analyse_interval: "5s"  # hoe vaak een geldig datapakket geanalyseerd wordt (0s = elk)

external_components:
  - source:
      type: git
      url: https://github.com/v12345vtm/Elsner-Meteo_peha
      ref: main
    # Hoe vaak ESPHome de GitHub-code opnieuw ophaalt bij compileren.
    # Tijdens ontwikkelen: 0s. Gewoon gebruik: 1h of 1d.
    refresh: 1h
    components: [elsner]

uart:
  - id: uart_elsner
    rx_pin: ${elsner_rx_pin}
    tx_pin: ${elsner_tx_pin}
    baud_rate: 19200            # vast: het protocol van het weerstation
    rx_buffer_size: 1024        # ruimte voor een paar frames als de loop even stilvalt

elsner:
  id: elsner_hub
  uart_id: uart_elsner
  analyse_interval: ${elsner_analyse_interval}

# ---- Meetwaarden (beide varianten) ----
sensor:
  - platform: elsner
    elsner_id: elsner_hub
    type: temperature
    name: "Temperature"
  - platform: elsner
    elsner_id: elsner_hub
    type: sun_south
    name: "Sun south"
  - platform: elsner
    elsner_id: elsner_hub
    type: sun_west
    name: "Sun west"
  - platform: elsner
    elsner_id: elsner_hub
    type: sun_east
    name: "Sun east"
  - platform: elsner
    elsner_id: elsner_hub
    type: daylight
    name: "Daylight"
  - platform: elsner
    elsner_id: elsner_hub
    type: wind
    name: "Wind"
  # Datum en tijd (diagnose). Bij de GPS-variant is dit UTC-tijd.
  - platform: elsner
    elsner_id: elsner_hub
    type: day
    name: "Day"
  - platform: elsner
    elsner_id: elsner_hub
    type: month
    name: "Month"
  - platform: elsner
    elsner_id: elsner_hub
    type: year
    name: "Year"
  - platform: elsner
    elsner_id: elsner_hub
    type: hour
    name: "Hour"
  - platform: elsner
    elsner_id: elsner_hub
    type: minute
    name: "Minute"
  - platform: elsner
    elsner_id: elsner_hub
    type: second
    name: "Second"
  # Diagnose-tellers
  - platform: elsner
    elsner_id: elsner_hub
    type: frames_received
    name: "Frames received"
  - platform: elsner
    elsner_id: elsner_hub
    type: frames_analysed
    name: "Frames analysed"
  - platform: elsner
    elsner_id: elsner_hub
    type: frames_skipped
    name: "Frames skipped"
  - platform: elsner
    elsner_id: elsner_hub
    type: frames_invalid
    name: "Frames invalid"

binary_sensor:
  - platform: elsner
    elsner_id: elsner_hub
    type: twilight
    name: "Twilight"
  - platform: elsner
    elsner_id: elsner_hub
    type: rain
    name: "Rain"
  - platform: elsner
    elsner_id: elsner_hub
    type: checksum_valid
    name: "Checksum valid"

text_sensor:
  - platform: elsner
    elsner_id: elsner_hub
    type: weekday
    name: "Weekday"
  - platform: elsner
    elsner_id: elsner_hub
    type: summer_time
    name: "Summer time"
  - platform: elsner
    elsner_id: elsner_hub
    type: variant
    name: "Variant"
  - platform: elsner
    elsner_id: elsner_hub
    type: raw_packet
    name: "Raw packet"

button:
  - platform: elsner
    elsner_id: elsner_hub
    name: "Reset connection"

